<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Smart - Recuperar Contraseña</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="/tiendasmart/assets/css/estilos.css">
</head>
<body class="bg-mesh-gradient d-flex flex-column min-vh-100">

    <!-- Header dinámico -->
    <div id="header-container"></div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    <div class="card glass-card border-0 shadow-lg rounded-4 p-4 p-md-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                            <h2 class="fw-bold text-primary mt-2">Recuperar Acceso</h2>
                            <p class="text-muted small">Ingresa tu correo y el código único de recuperación para crear una nueva contraseña.</p>
                        </div>

                        <form action="/tiendasmart/controllers/seguridad/recuperar-password.php" method="POST">
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control rounded-3" id="email" name="email" placeholder="Correo electrónico" required>
                                <label for="email">Correo electrónico</label>
                            </div>
                            
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control rounded-3 border-primary" id="token" name="token" placeholder="Código de recuperación" required>
                                <label for="token">Código de recuperación (16 caracteres)</label>
                            </div>

                            <div class="form-floating mb-3 position-relative">
                                <input type="password" class="form-control rounded-3 pe-5" id="newPassword" name="password" placeholder="Nueva Contraseña" required>
                                <label for="newPassword">Nueva Contraseña</label>
                                <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent text-muted toggle-password" data-target="newPassword">
                                    <i class="bi bi-eye fs-5"></i>
                                </button>
                            </div>

                            <div class="form-floating mb-4 position-relative">
                                <input type="password" class="form-control rounded-3 pe-5" id="confirmNewPassword" name="confirm_password" placeholder="Confirmar Contraseña" required>
                                <label for="confirmNewPassword">Confirmar Nueva Contraseña</label>
                                <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent text-muted toggle-password" data-target="confirmNewPassword">
                                    <i class="bi bi-eye fs-5"></i>
                                </button>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm mb-3">
                                <i class="bi bi-arrow-clockwise me-2"></i>Actualizar Contraseña
                            </button>

                            <div class="text-center small">
                                <a href="/tiendasmart/views/seguridad/login.html" class="text-decoration-none fw-bold text-secondary">
                                    <i class="bi bi-arrow-left me-1"></i>Volver al inicio de sesión
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer dinámico -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 para pop-ups amigables -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Script principal -->
    <script src="/tiendasmart/assets/js/main.js"></script>
</body>
</html>
