<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Smart - Crear Cuenta</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="/tiendasmart/assets/css/estilos.css">
</head>
<body class="bg-mesh-gradient d-flex flex-column min-vh-100">

    <!-- Header dinámico -->
    <div id="header-container"></div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8 col-xl-7">
                    <div class="card glass-card border-0 shadow-lg rounded-4 p-4 p-md-5">
                        <div class="text-center mb-4">
                            <img src="/tiendasmart/assets/images/logo.png" alt="Logo Tienda Smart" width="55" height="55" class="mb-2">
                            <h2 class="fw-bold text-primary">Crea tu cuenta</h2>
                            <p class="text-muted small">Únete a Tienda Smart y disfruta de la mejor experiencia</p>
                        </div>

                        <form action="/tiendasmart/controllers/seguridad/registro.php" method="POST">
                            <div class="row g-3">
                                <!-- Columna 1 -->
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control rounded-3" id="nombre" name="nombre" placeholder="Nombre" required>
                                        <label for="nombre">Nombre</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="tel" class="form-control rounded-3" id="telefono" name="telefono" placeholder="Teléfono" required>
                                        <label for="telefono">Teléfono</label>
                                    </div>
                                </div>

                                <!-- Columna 2 -->
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control rounded-3" id="direccion" name="direccion" placeholder="Dirección" required>
                                        <label for="direccion">Dirección</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="email" class="form-control rounded-3" id="correo" name="email" placeholder="Correo" required>
                                        <label for="correo">Correo electrónico</label>
                                    </div>
                                </div>

                                <!-- Fila Completa para Contraseñas -->
                                <div class="col-12">
                                    <div class="form-floating mb-3 position-relative">
                                        <input type="password" class="form-control rounded-3 pe-5" id="regPassword" name="password" placeholder="Contraseña" required>
                                        <label for="regPassword">Contraseña</label>
                                        <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent text-muted toggle-password" data-target="regPassword">
                                            <i class="bi bi-eye fs-5"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating mb-4 position-relative">
                                        <input type="password" class="form-control rounded-3 pe-5" id="confirmPassword" name="confirm_password" placeholder="Confirmar Contraseña" required>
                                        <label for="confirmPassword">Confirmar contraseña</label>
                                        <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent text-muted toggle-password" data-target="confirmPassword">
                                            <i class="bi bi-eye fs-5"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- Botón Principal -->
                            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm mb-3">Crear Cuenta</button>

                            <!-- Enlace Retorno -->
                            <div class="text-center small">
                                <span class="text-muted">¿Ya tienes una cuenta?</span> 
                                <a href="/tiendasmart/views/seguridad/login.html" class="text-decoration-none fw-bold text-primary">Inicia sesión</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer dinámico -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SweetAlert2 para pop-ups amigables -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Script principal -->
    <script src="/tiendasmart/assets/js/main.js"></script>
</body>
</html>
