<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Smart - Iniciar Sesión</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="/tiendasmart/assets/css/estilos.css">
</head>
<body class="bg-mesh-gradient d-flex flex-column min-vh-100">

    <!-- Header dinámico -->
    <div id="header-container"></div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card glass-card border-0 shadow-lg rounded-4 p-4 p-md-5">
                        <div class="text-center mb-4">
                            <img src="/tiendasmart/assets/images/logo.png" alt="Logo Tienda Smart" width="60" height="60" class="mb-3">
                            <h2 class="fw-bold text-primary">¡Bienvenido de nuevo!</h2>
                            <p class="text-muted small">Ingresa a tu cuenta en Tienda Smart</p>
                        </div>

                        <!-- Formulario ajustado con action y method -->
                        <form action="/tiendasmart/controllers/seguridad/login.php" method="POST">
                            <!-- Campo Correo -->
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control rounded-3" id="floatingEmail" name="email" placeholder="nombre@ejemplo.com" required>
                                <label for="floatingEmail"><i class="bi bi-envelope me-1"></i> Correo electrónico</label>
                            </div>

                            <!-- Campo Contraseña con botón de ojito -->
                            <div class="form-floating mb-3 position-relative">
                                <input type="password" class="form-control rounded-3 pe-5" id="floatingPassword" name="password" placeholder="Contraseña" required>
                                <label for="floatingPassword"><i class="bi bi-lock me-1"></i> Contraseña</label>
                                <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent text-muted toggle-password" data-target="floatingPassword">
                                    <i class="bi bi-eye fs-5"></i>
                                </button>
                            </div>

                            <!-- Opciones adicionales -->
                            <div class="d-flex justify-content-between align-items-center mb-4 small">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
                                    <label class="form-check-label text-muted" for="rememberMe">Recordarme</label>
                                </div>
                                <a href="/tiendasmart/views/seguridad/recuperar-password.html" class="text-decoration-none text-primary">¿Olvidaste tu contraseña?</a>
                            </div>

                            <!-- Botón Principal -->
                            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm mb-3">Iniciar Sesión</button>

                            <!-- Enlace Registro -->
                            <div class="text-center small">
                                <span class="text-muted">¿No tienes una cuenta?</span> 
                                <a href="/tiendasmart/views/seguridad/registro.html" class="text-decoration-none fw-bold text-primary">Regístrate aquí</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer dinámico -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SweetAlert2 para pop-ups amigables -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Script principal de interacciones -->
    <script src="/tiendasmart/assets/js/main.js"></script>
</body>
</html>
