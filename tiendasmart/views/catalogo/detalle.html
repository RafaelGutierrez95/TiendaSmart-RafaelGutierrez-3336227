<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Smart - Detalle del Producto</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="/tiendasmart/assets/css/estilos.css">
</head>
<body class="bg-mesh-gradient d-flex flex-column min-vh-100">

    <!-- Header dinámico -->
    <div id="header-container"></div>

    <main class="flex-grow-1 container d-flex align-items-center py-5">
        <div class="w-100">
            <!-- Contenedor Principal con Glassmorphism -->
            <div class="glass-card p-4 p-md-5 rounded-4 shadow-lg my-3" id="contenedor-detalle">
                <div class="row align-items-center g-4">
                    <!-- Columna Izquierda: Imagen Grande -->
                    <div class="col-lg-6 text-center">
                        <img id="detalle-imagen" src="/tiendasmart/assets/images/logo.png" alt="Producto" class="img-fluid rounded-4 shadow-sm bg-white p-3" style="max-height: 400px; object-fit: contain;">
                    </div>

                    <!-- Columna Derecha: Información y Acciones -->
                    <div class="col-lg-6">
                        <a href="/tiendasmart/views/catalogo/catalogo.html" class="text-decoration-none text-primary fw-semibold small mb-2 d-inline-block">
                            <i class="bi bi-arrow-left me-1"></i> Volver al catálogo
                        </a>

                        <span id="detalle-categoria" class="text-muted small d-block mb-1">Categoría</span>
                        <h2 id="detalle-nombre" class="fw-bold text-dark mb-2">Cargando producto...</h2>
                        
                        <p id="detalle-precio" class="fs-2 text-success fw-bold mb-3">0</p>

                        <p class="text-success small mb-3">
                            <i class="bi bi-check-circle-fill me-1"></i> <span id="detalle-estado">Disponible en Tienda</span>
                        </p>

                        <p id="detalle-descripcion" class="text-muted mb-4">
                            Cargando información del producto...
                        </p>

                        <!-- Selector de cantidad -->
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">Cantidad</label>
                            <div class="input-group" style="width: 140px;">
                                <button class="btn btn-outline-secondary" type="button">-</button>
                                <input type="text" id="detalle-cantidad" class="form-control text-center bg-white" value="1" readonly>
                                <button class="btn btn-outline-secondary" type="button">+</button>
                            </div>
                        </div>

                        <!-- Botón principal de compra -->
                        <button id="btn-agregar-detalle" class="w-100 btn btn-lg btn-primary rounded-pill shadow-sm fw-bold">
                            <i class="bi bi-cart-plus me-2"></i> Agregar al Carrito
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer dinámico -->
    <div id="footer-container"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Script principal -->
    <script src="/tiendasmart/assets/js/main.js"></script>
</body>
</html>
