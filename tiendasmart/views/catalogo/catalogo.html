<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Smart - Catálogo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="/tiendasmart/assets/css/estilos.css">
</head>
<body class="bg-mesh-gradient d-flex flex-column min-vh-100">

    <!-- Header dinámico -->
    <div id="header-container"></div>

    <main class="flex-grow-1 container py-5">
        <!-- Título de la sección -->
        <div class="text-center mb-4">
            <h1 class="fw-bold text-primary">Nuestro Catálogo</h1>
            <p class="text-muted">Explora los productos de la canasta familiar y mucho más</p>
        </div>

        <!-- Buscador y Filtros -->
        <div class="glass-card p-3 rounded-4 mb-4 shadow-sm">
            <div class="row g-3 align-items-center">
                <div class="col-12 col-md-5">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" id="buscador-catalogo" class="form-control border-start-0 ps-0" placeholder="Buscar productos...">
                    </div>
                </div>
                <div class="col-12 col-md-7 d-flex flex-wrap gap-2 justify-content-md-end" id="filtros-categoria">
                    <button class="btn btn-primary rounded-pill px-3 active" data-categoria="Todos">Todos</button>
                    <button class="btn btn-outline-primary rounded-pill px-3" data-categoria="Víveres">Víveres</button>
                    <button class="btn btn-outline-primary rounded-pill px-3" data-categoria="Lácteos">Lácteos</button>
                    <button class="btn btn-outline-primary rounded-pill px-3" data-categoria="Abarrotes">Abarrotes</button>
                    <button class="btn btn-outline-primary rounded-pill px-3" data-categoria="Aseo">Aseo</button>
                    <button class="btn btn-outline-primary rounded-pill px-3" data-categoria="Snacks">Snacks</button>
                </div>
            </div>
        </div>

        <!-- Grid Dinámico de Productos -->
        <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4" id="contenedor-productos">
            <div class="col-12 text-center py-5 w-100">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2">Cargando productos desde la base de datos...</p>
            </div>
        </div>
    </main>

    <!-- Footer dinámico -->
    <div id="footer-container"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Script principal -->
    <script src="/tiendasmart/assets/js/main.js"></script>
</body>
</html>
